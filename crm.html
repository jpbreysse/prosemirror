<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Customer CRM</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #f1f5f9;
      color: #1e293b;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* ── Top bar ─────────────────────────────────────────────────── */
    .topbar {
      background: #1e293b;
      color: #fff;
      padding: 0 20px;
      height: 52px;
      display: flex;
      align-items: center;
      gap: 12px;
      flex-shrink: 0;
    }
    .topbar-logo { font-size: 1.1rem; font-weight: 700; letter-spacing: -0.02em; }
    .topbar-logo span { color: #818cf8; }
    .topbar-sep { flex: 1; }
    .topbar-pill {
      background: #334155;
      border-radius: 20px;
      padding: 4px 12px;
      font-size: 0.75rem;
      color: #94a3b8;
    }
    .topbar-pill strong { color: #e2e8f0; }

    /* ── Layout ──────────────────────────────────────────────────── */
    .layout {
      display: flex;
      flex: 1;
      overflow: hidden;
      gap: 0;
    }

    /* ── Sidebar ─────────────────────────────────────────────────── */
    .sidebar {
      width: 300px;
      flex-shrink: 0;
      background: #fff;
      border-right: 1px solid #e2e8f0;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .sidebar-header {
      padding: 14px 16px 10px;
      border-bottom: 1px solid #f1f5f9;
    }
    .sidebar-title {
      font-size: 0.72rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: #94a3b8;
      margin-bottom: 8px;
    }
    .search-wrap { position: relative; }
    .search-input {
      width: 100%;
      border: 1px solid #e2e8f0;
      border-radius: 7px;
      padding: 7px 10px 7px 30px;
      font-size: 0.82rem;
      outline: none;
      background: #f8fafc;
      transition: border-color 0.15s;
    }
    .search-input:focus { border-color: #6366f1; background: #fff; }
    .search-icon {
      position: absolute;
      left: 9px; top: 50%;
      transform: translateY(-50%);
      color: #94a3b8;
      font-size: 0.8rem;
      pointer-events: none;
    }
    .filter-row {
      display: flex;
      gap: 4px;
      margin-top: 8px;
    }
    .filter-btn {
      flex: 1;
      border: 1px solid #e2e8f0;
      border-radius: 6px;
      padding: 4px 0;
      font-size: 0.7rem;
      font-weight: 600;
      cursor: pointer;
      background: #f8fafc;
      color: #64748b;
      transition: all 0.1s;
    }
    .filter-btn:hover  { border-color: #6366f1; color: #6366f1; }
    .filter-btn.active { background: #eef2ff; border-color: #6366f1; color: #6366f1; }

    .customer-list {
      flex: 1;
      overflow-y: auto;
      padding: 6px 8px;
    }
    .customer-item {
      padding: 10px 10px;
      border-radius: 8px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 10px;
      transition: background 0.1s;
      margin-bottom: 2px;
    }
    .customer-item:hover    { background: #f8fafc; }
    .customer-item.selected { background: #eef2ff; }
    .ci-avatar {
      width: 34px; height: 34px;
      border-radius: 50%;
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      color: #fff;
      font-weight: 700;
      font-size: 0.85rem;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }
    .ci-body { flex: 1; min-width: 0; }
    .ci-name {
      font-size: 0.83rem;
      font-weight: 600;
      color: #1e293b;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .ci-company {
      font-size: 0.72rem;
      color: #94a3b8;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .ci-right { display: flex; flex-direction: column; align-items: flex-end; gap: 3px; }
    .status-dot {
      width: 7px; height: 7px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .ci-counts { font-size: 0.65rem; color: #cbd5e1; }

    .empty-list {
      text-align: center;
      padding: 40px 16px;
      color: #94a3b8;
      font-size: 0.83rem;
    }

    /* ── Main panel ──────────────────────────────────────────────── */
    .main {
      flex: 1;
      overflow-y: auto;
      padding: 24px;
    }

    .placeholder {
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #cbd5e1;
      gap: 12px;
    }
    .placeholder-icon { font-size: 2.5rem; }
    .placeholder-text { font-size: 0.9rem; }

    /* ── Detail card ─────────────────────────────────────────────── */
    .detail { max-width: 720px; }

    .detail-header {
      background: #fff;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      padding: 20px 24px;
      display: flex;
      gap: 16px;
      align-items: flex-start;
      margin-bottom: 16px;
    }
    .detail-avatar {
      width: 52px; height: 52px;
      border-radius: 50%;
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      color: #fff;
      font-weight: 700;
      font-size: 1.3rem;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }
    .detail-info { flex: 1; }
    .detail-name { font-size: 1.2rem; font-weight: 700; margin-bottom: 4px; }
    .detail-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 4px 14px;
      font-size: 0.8rem;
      color: #64748b;
      margin-bottom: 10px;
    }
    .detail-meta a { color: #6366f1; text-decoration: none; }
    .detail-meta a:hover { text-decoration: underline; }
    .detail-badges { display: flex; gap: 6px; flex-wrap: wrap; }
    .badge {
      font-size: 0.7rem;
      font-weight: 700;
      padding: 3px 10px;
      border-radius: 20px;
      border: 1px solid;
      text-transform: capitalize;
    }
    .detail-stats {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 6px;
    }
    .stat-pill {
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      padding: 5px 12px;
      text-align: center;
    }
    .stat-num  { font-size: 1.1rem; font-weight: 700; color: #6366f1; }
    .stat-lbl  { font-size: 0.65rem; color: #94a3b8; text-transform: uppercase; letter-spacing: 0.05em; }
    .detail-sync {
      font-size: 0.7rem;
      color: #cbd5e1;
      margin-top: 4px;
    }

    /* ── Tabs ────────────────────────────────────────────────────── */
    .tabs { display: flex; gap: 4px; margin-bottom: 12px; }
    .tab-btn {
      border: none;
      background: #fff;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      padding: 7px 16px;
      font-size: 0.82rem;
      font-weight: 600;
      color: #64748b;
      cursor: pointer;
      transition: all 0.1s;
    }
    .tab-btn:hover  { border-color: #6366f1; color: #6366f1; }
    .tab-btn.active { background: #6366f1; color: #fff; border-color: #6366f1; }

    /* ── Assets table ────────────────────────────────────────────── */
    .card {
      background: #fff;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      overflow: hidden;
    }
    .card-title {
      padding: 14px 18px;
      font-size: 0.72rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: #94a3b8;
      border-bottom: 1px solid #f1f5f9;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.82rem;
    }
    thead th {
      text-align: left;
      padding: 10px 18px;
      font-size: 0.7rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #94a3b8;
      background: #fafafa;
      border-bottom: 1px solid #f1f5f9;
    }
    tbody td {
      padding: 11px 18px;
      border-bottom: 1px solid #f8fafc;
      color: #334155;
    }
    tbody tr:last-child td { border-bottom: none; }
    tbody tr:hover td { background: #f8fafc; }
    .asset-name { font-weight: 600; color: #1e293b; }
    .asset-meta { font-size: 0.72rem; color: #94a3b8; margin-top: 1px; }

    /* ── Interactions timeline ───────────────────────────────────── */
    .timeline { padding: 6px 0; }
    .tl-item {
      display: flex;
      gap: 14px;
      padding: 14px 18px;
      border-bottom: 1px solid #f8fafc;
      transition: background 0.1s;
    }
    .tl-item:last-child { border-bottom: none; }
    .tl-item:hover { background: #f8fafc; }
    .tl-icon { font-size: 1.1rem; flex-shrink: 0; margin-top: 1px; }
    .tl-body { flex: 1; }
    .tl-row  { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; margin-bottom: 3px; }
    .tl-title { font-weight: 600; font-size: 0.85rem; color: #1e293b; }
    .tl-date  { font-size: 0.72rem; color: #94a3b8; white-space: nowrap; }
    .tl-notes { font-size: 0.8rem; color: #475569; line-height: 1.5; margin-bottom: 4px; }
    .tl-tags  { display: flex; gap: 6px; flex-wrap: wrap; }
    .tl-tag   { font-size: 0.68rem; color: #64748b; background: #f1f5f9; border-radius: 20px; padding: 1px 8px; }

    /* ── Status colours ──────────────────────────────────────────── */
    .s-prospect  { background:#eff6ff; color:#1d4ed8; border-color:#bfdbfe; }
    .s-active    { background:#f0fdf4; color:#166534; border-color:#bbf7d0; }
    .s-inactive  { background:#f9fafb; color:#6b7280; border-color:#e5e7eb; }
    .s-churned   { background:#fef2f2; color:#991b1b; border-color:#fecaca; }
    .t-standard  { background:#f9fafb; color:#374151; border-color:#e5e7eb; }
    .t-premium   { background:#fefce8; color:#854d0e; border-color:#fef08a; }
    .t-enterprise{ background:#faf5ff; color:#6b21a8; border-color:#e9d5ff; }

    .dot-prospect  { background: #3b82f6; }
    .dot-active    { background: #16a34a; }
    .dot-inactive  { background: #9ca3af; }
    .dot-churned   { background: #dc2626; }

    .as-operational    { background:#f0fdf4; color:#166534; border-color:#bbf7d0; }
    .as-maintenance    { background:#fefce8; color:#854d0e; border-color:#fef08a; }
    .as-offline        { background:#fef2f2; color:#991b1b; border-color:#fecaca; }
    .as-decommissioned { background:#f9fafb; color:#6b7280; border-color:#e5e7eb; }

    /* ── Loading ─────────────────────────────────────────────────── */
    .spinner {
      display: inline-block;
      width: 14px; height: 14px;
      border: 2px solid #e2e8f0;
      border-top-color: #6366f1;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      vertical-align: middle;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loading-row { padding: 30px; text-align: center; color: #94a3b8; font-size: 0.83rem; }
    .empty-row   { padding: 30px; text-align: center; color: #cbd5e1; font-size: 0.83rem; }
  </style>
</head>
<body>

<!-- Top bar -->
<div class="topbar">
  <div class="topbar-logo">Customer<span>CRM</span></div>
  <div class="topbar-sep"></div>
  <div class="topbar-pill">API <strong>localhost:3002</strong></div>
</div>

<!-- Layout -->
<div class="layout">

  <!-- Sidebar -->
  <div class="sidebar">
    <div class="sidebar-header">
      <div class="sidebar-title">Customers</div>
      <div class="search-wrap">
        <span class="search-icon">🔍</span>
        <input class="search-input" id="searchInput" placeholder="Search name, email, company…" />
      </div>
      <div class="filter-row" id="filterRow">
        <button class="filter-btn active" data-status="">All</button>
        <button class="filter-btn" data-status="prospect">Prospect</button>
        <button class="filter-btn" data-status="active">Active</button>
        <button class="filter-btn" data-status="inactive">Inactive</button>
      </div>
    </div>
    <div class="customer-list" id="customerList">
      <div class="loading-row"><span class="spinner"></span> Loading…</div>
    </div>
  </div>

  <!-- Main panel -->
  <div class="main" id="mainPanel">
    <div class="placeholder">
      <div class="placeholder-icon">👤</div>
      <div class="placeholder-text">Select a customer to view details</div>
    </div>
  </div>

</div>

<script>
  const API_KEY  = 'customer-api-dev-key';
  const BASE_URL = ""; // same origin, or change to http://localhost:3002

  let allCustomers   = [];
  let selectedId     = null;
  let activeStatus   = '';
  let activeTab      = 'assets';
  let searchDebounce = null;

  // ── API ──────────────────────────────────────────────────────────────────────

  async function apiFetch(path) {
    const res = await fetch(BASE_URL + '/api/crm' + path, {
      headers: { 'X-API-Key': API_KEY }
    });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    return res.json();
  }

  // ── Sidebar ──────────────────────────────────────────────────────────────────

  async function loadCustomers() {
    const search = document.getElementById('searchInput').value.trim();
    const qs = new URLSearchParams({ limit: '50' });
    if (activeStatus) qs.set('status', activeStatus);
    if (search)       qs.set('search', search);

    try {
      const res = await apiFetch(`/customers?${qs}`);
      allCustomers = res.data;
      renderList(allCustomers);
      updateTopbar(res.meta.total);
    } catch (e) {
      document.getElementById('customerList').innerHTML =
        `<div class="empty-list">⚠️ Could not reach API<br><small>${e.message}</small></div>`;
    }
  }

  function updateTopbar(total) {
    document.querySelector('.topbar-pill').innerHTML =
      `<strong>${total}</strong> customer${total !== 1 ? 's' : ''}`;
  }

  function renderList(customers) {
    const el = document.getElementById('customerList');
    if (!customers.length) {
      el.innerHTML = '<div class="empty-list">No customers found</div>';
      return;
    }
    el.innerHTML = customers.map(c => `
      <div class="customer-item ${c.id === selectedId ? 'selected' : ''}"
           data-id="${c.id}" onclick="selectCustomer('${c.id}')">
        <div class="ci-avatar">${c.name[0].toUpperCase()}</div>
        <div class="ci-body">
          <div class="ci-name">${c.name}</div>
          <div class="ci-company">${c.company || c.email || '—'}</div>
        </div>
        <div class="ci-right">
          <div class="status-dot dot-${c.status}"></div>
          <div class="ci-counts">${c.asset_count}A · ${c.interaction_count}I</div>
        </div>
      </div>`).join('');
  }

  // ── Detail ───────────────────────────────────────────────────────────────────

  async function selectCustomer(id) {
    // Only reset tab when switching to a different customer
    if (id !== selectedId) activeTab = 'assets';
    selectedId = id;

    // Highlight in list
    document.querySelectorAll('.customer-item').forEach(el => {
      el.classList.toggle('selected', el.dataset.id === id);
    });

    // Show loading state
    document.getElementById('mainPanel').innerHTML =
      '<div class="placeholder"><span class="spinner"></span></div>';

    try {
      const [customer, assetsRes, intRes] = await Promise.all([
        apiFetch(`/customers/${id}`),
        apiFetch(`/customers/${id}/assets`),
        apiFetch(`/customers/${id}/interactions?limit=30`),
      ]);
      renderDetail(customer, assetsRes.data, intRes.data);
    } catch (e) {
      document.getElementById('mainPanel').innerHTML =
        `<div class="placeholder"><div class="placeholder-icon">⚠️</div>
         <div class="placeholder-text">${e.message}</div></div>`;
    }
  }

  function renderDetail(c, assets, interactions) {
    const syncTime = new Date().toLocaleTimeString();
    document.getElementById('mainPanel').innerHTML = `
      <div class="detail">

        <!-- Header -->
        <div class="detail-header">
          <div class="detail-avatar">${c.name[0].toUpperCase()}</div>
          <div class="detail-info">
            <div class="detail-name">${c.name}</div>
            <div class="detail-meta">
              ${c.company   ? `<span>🏢 ${c.company}</span>` : ''}
              ${c.email     ? `<a href="mailto:${c.email}">✉️ ${c.email}</a>` : ''}
              ${c.phone     ? `<span>📞 ${c.phone}</span>` : ''}
              ${c.address   ? `<span>📍 ${c.address}</span>` : ''}
            </div>
            <div class="detail-badges">
              <span class="badge s-${c.status}">${c.status}</span>
              <span class="badge t-${c.type}">${c.type}</span>
              <span style="font-size:.7rem;color:#94a3b8;margin-left:4px">
                ID: ${c.id.slice(0,8)}…
              </span>
            </div>
          </div>
          <div class="detail-stats">
            <div class="stat-pill">
              <div class="stat-num">${assets.length}</div>
              <div class="stat-lbl">Assets</div>
            </div>
            <div class="stat-pill">
              <div class="stat-num">${interactions.length}</div>
              <div class="stat-lbl">Interactions</div>
            </div>
            <div class="detail-sync">Synced ${syncTime}</div>
          </div>
        </div>

        <!-- Tabs -->
        <div class="tabs">
          <button class="tab-btn ${activeTab==='assets'?'active':''}"
            onclick="switchTab('assets','${c.id}')">
            Assets (${assets.length})
          </button>
          <button class="tab-btn ${activeTab==='interactions'?'active':''}"
            onclick="switchTab('interactions','${c.id}')">
            Interactions (${interactions.length})
          </button>
          ${c.notes ? `<button class="tab-btn ${activeTab==='notes'?'active':''}"
            onclick="switchTab('notes','${c.id}')">Notes</button>` : ''}
        </div>

        <!-- Tab content -->
        <div id="tabContent">
          ${activeTab === 'assets'       ? renderAssets(assets)       : ''}
          ${activeTab === 'interactions' ? renderInteractions(interactions) : ''}
          ${activeTab === 'notes'        ? renderNotes(c.notes)       : ''}
        </div>

      </div>`;
  }

  function switchTab(tab, customerId) {
    activeTab = tab;
    // Re-fetch to stay fresh
    selectCustomer(customerId);
  }

  // ── Assets ───────────────────────────────────────────────────────────────────

  function renderAssets(assets) {
    if (!assets.length)
      return '<div class="card"><div class="empty-row">No assets linked yet</div></div>';

    const rows = assets.map(a => `
      <tr>
        <td>
          <div class="asset-name">${a.name}</div>
          <div class="asset-meta">${[a.type, a.manufacturer, a.model].filter(Boolean).join(' · ')}</div>
        </td>
        <td>${a.location || '—'}</td>
        <td>${a.serial_number || '—'}</td>
        <td>${a.installed_at ? new Date(a.installed_at).toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'}) : '—'}</td>
        <td><span class="badge as-${a.status}">${a.status}</span></td>
      </tr>`).join('');

    return `
      <div class="card">
        <div class="card-title">Assets — ${assets.length} registered</div>
        <table>
          <thead>
            <tr>
              <th>Name</th>
              <th>Location</th>
              <th>Serial no.</th>
              <th>Installed</th>
              <th>Status</th>
            </tr>
          </thead>
          <tbody>${rows}</tbody>
        </table>
      </div>`;
  }

  // ── Interactions ──────────────────────────────────────────────────────────────

  const INT_ICONS = { note:'📝', call:'📞', visit:'🏢', email:'✉️', maintenance:'🔧', alert:'⚠️' };

  function renderInteractions(interactions) {
    if (!interactions.length)
      return '<div class="card"><div class="empty-row">No interactions recorded yet</div></div>';

    const items = interactions.map(i => {
      const date = new Date(i.created_at).toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'});
      return `
        <div class="tl-item">
          <div class="tl-icon">${INT_ICONS[i.type] || '📝'}</div>
          <div class="tl-body">
            <div class="tl-row">
              <span class="tl-title">${i.title || i.type}</span>
              <span class="tl-date">${date}</span>
            </div>
            ${i.notes ? `<div class="tl-notes">${i.notes}</div>` : ''}
            <div class="tl-tags">
              ${i.created_by  ? `<span class="tl-tag">👤 ${i.created_by}</span>` : ''}
              ${i.asset_name  ? `<span class="tl-tag">📦 ${i.asset_name}</span>` : ''}
              <span class="tl-tag">${i.type}</span>
            </div>
          </div>
        </div>`;
    }).join('');

    return `<div class="card"><div class="timeline">${items}</div></div>`;
  }

  // ── Notes ────────────────────────────────────────────────────────────────────

  function renderNotes(notes) {
    return `<div class="card" style="padding:20px 24px;font-size:.85rem;color:#475569;line-height:1.7">${notes}</div>`;
  }

  // ── Events ───────────────────────────────────────────────────────────────────

  document.getElementById('searchInput').addEventListener('input', () => {
    clearTimeout(searchDebounce);
    searchDebounce = setTimeout(loadCustomers, 300);
  });

  document.getElementById('filterRow').addEventListener('click', e => {
    const btn = e.target.closest('.filter-btn');
    if (!btn) return;
    activeStatus = btn.dataset.status;
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    loadCustomers();
  });

  // ── Init ─────────────────────────────────────────────────────────────────────

  loadCustomers();

  // Auto-refresh sidebar every 30s
  setInterval(loadCustomers, 30_000);
</script>
</body>
</html>
